  <section class="contact-section">
    <h2 data-aos="fade-left">Contact Me</h2>
    <p>If you’d like to discuss any project or have questions, feel free to reach out using the form below. I’ll get back to you as soon as possible.</p>

    <form action="mailto:aleezamultazim@gmail.com" method="post" enctype="text/plain" class="contact-form">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required />
      </div>

      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required />
      </div>

      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="message" placeholder="Type your message here..." rows="5" required></textarea>
      </div>

      <button type="submit" class="btn">Send Message</button>
    </form>
  </section>
